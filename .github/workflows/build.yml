name: Build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and test
        run: ./mvnw -B verify
      - name: Check libraries for known vulnerabilities
        run: python3 .github/scripts/check-vulnerabilities.py target/bom.json
      - name: Package the Linux app
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as e; print(e.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text)")
          sh packaging/linux/package.sh "$version"
          echo "ARCHIVE=dist/EVEFarm-$version-linux-x64.tar.gz" >> "$GITHUB_ENV"
      - name: Install the desktop tools for the check
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus dbus-x11 gnome-keyring libsecret-1-0
      - name: Check the packaged Linux app
        run: sh packaging/linux/check-package.sh "$ARCHIVE"
