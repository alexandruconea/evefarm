name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'

      - name: Check the tag matches the version in pom.xml
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -Raw pom.xml)).project.version
          if ("v$version" -ne $env:TAG) {
            throw "Tag $env:TAG doesn't match the version in pom.xml ($version). Tag it v$version."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and test
        shell: pwsh
        run: ./mvnw.cmd -B verify

      - name: Package EVEFarm.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item target/evefarm.jar stage/
          jpackage --type app-image --input stage --dest dist --name EVEFarm `
            --main-jar evefarm.jar --main-class com.evefarm.Main --icon packaging/evefarm.ico `
            --java-options --enable-native-access=ALL-UNNAMED `
            --app-version $env:VERSION --vendor "Alex Conea" `
            --description "EVE Online multi-character asset and net-worth tracker"
          Copy-Item packaging/README.txt dist/EVEFarm/

      - name: Upload EVEFarm.exe for Authenticode signing
        id: unsigned-launcher
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unsigned-launcher
          path: dist/EVEFarm/EVEFarm.exe
          if-no-files-found: error

      - name: Sign EVEFarm.exe with Authenticode
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-launcher.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed-launcher

      - name: Use the signed EVEFarm.exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          Copy-Item signed-launcher/EVEFarm.exe dist/EVEFarm/EVEFarm.exe -Force
          $signature = Get-AuthenticodeSignature -LiteralPath dist/EVEFarm/EVEFarm.exe
          if ($signature.Status -ne 'Valid') {
            throw "EVEFarm.exe is not validly signed: $($signature.Status) $($signature.StatusMessage)"
          }
          "EVEFarm.exe signed by $($signature.SignerCertificate.Subject)"

      - name: Zip the app
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\tar.exe" -a -c -f "dist/EVEFarm-$env:VERSION-win64.zip" -C dist EVEFarm
          if ($LASTEXITCODE -ne 0) { throw "zip failed" }
          Copy-Item target/bom.json "dist/EVEFarm-$env:VERSION-sbom.cdx.json"

      - name: Sign the zip
        shell: pwsh
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: java -cp target/classes packaging/SignRelease.java "dist/EVEFarm-$env:VERSION-win64.zip" $env:VERSION

      - name: Keep the Windows files for the release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-release
          path: |
            dist/EVEFarm-${{ env.VERSION }}-win64.zip
            dist/EVEFarm-${{ env.VERSION }}-win64.zip.sig
            dist/EVEFarm-${{ env.VERSION }}-win64.zip.sha256
            dist/EVEFarm-${{ env.VERSION }}-sbom.cdx.json
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '25'

      - name: Check the tag matches the version in pom.xml
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as e; print(e.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text)")
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG doesn't match the version in pom.xml ($version). Tag it v$version."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and test
        run: ./mvnw -B verify

      - name: Package the Linux app
        run: sh packaging/linux/package.sh "$VERSION"

      - name: Install the desktop tools for the check
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth dbus dbus-x11 gnome-keyring libsecret-1-0

      - name: Check the packaged app
        run: sh packaging/linux/check-package.sh "dist/EVEFarm-$VERSION-linux-x64.tar.gz"

      - name: Sign the archive
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: java -cp target/classes packaging/SignRelease.java "dist/EVEFarm-$VERSION-linux-x64.tar.gz" "$VERSION"

      - name: Keep the Linux files for the release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-release
          path: |
            dist/EVEFarm-${{ env.VERSION }}-linux-x64.tar.gz
            dist/EVEFarm-${{ env.VERSION }}-linux-x64.tar.gz.sig
            dist/EVEFarm-${{ env.VERSION }}-linux-x64.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Collect the signed files
        run: |
          gh run download "${{ github.run_id }}" --name windows-release --dir dist
          gh run download "${{ github.run_id }}" --name linux-release --dir dist
          ls -l dist

      - name: Create a draft release
        run: |
          version="${TAG#v}"
          gh release create "$TAG" \
            "dist/EVEFarm-$version-win64.zip" "dist/EVEFarm-$version-win64.zip.sig" \
            "dist/EVEFarm-$version-win64.zip.sha256" \
            "dist/EVEFarm-$version-linux-x64.tar.gz" "dist/EVEFarm-$version-linux-x64.tar.gz.sig" \
            "dist/EVEFarm-$version-linux-x64.tar.gz.sha256" \
            "dist/EVEFarm-$version-sbom.cdx.json" \
            --draft --title "EVE Farm $version" --generate-notes
