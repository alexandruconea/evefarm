@accentColor = #4a8fe7

Table.alternateRowColor = lighten($Table.background,3%)
Table.selectionBackground = #2f4a6e
Table.selectionForeground = #e6e9ed
Table.selectionInactiveBackground = #3a4452
Table.selectionInactiveForeground = #e6e9ed
TableHeader.background = darken($Table.background,2%)
TableHeader.foreground = #b6bcc4
TableHeader.separatorColor = lighten($Table.background,6%)
TableHeader.bottomSeparatorColor = lighten($Table.background,9%)

TabbedPane.hoverColor = lighten($Panel.background,5%)
TabbedPane.selectedBackground = fade(@accentColor,12%)
ScrollBar.thumb = lighten($Panel.background,16%)
ScrollBar.hoverThumbColor = lighten($Panel.background,24%)
ScrollBar.pressedThumbColor = lighten($Panel.background,30%)
